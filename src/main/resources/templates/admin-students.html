<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sinh Viên - Admin Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#"><i class="fas fa-graduation-cap"></i> QUẢN LÝ ĐÀO TẠO</a>
            <span class="navbar-text text-white">Admin Dashboard</span>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-white sidebar collapse shadow-sm py-3" style="min-height: 90vh;">
                <div class="position-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item mb-2">
                            <a class="nav-link active bg-primary text-white rounded p-2" href="/admin/students">
                                <i class="fas fa-users me-2"></i> Quản lý sinh viên
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <h2 class="mb-4 text-primary"><i class="fas fa-user-cog"></i> Bảng Quản Lý Danh Sách Sinh Viên</h2>

                <!-- Card Thêm Sinh Viên -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-success text-white fw-bold">
                        <i class="fas fa-user-plus"></i> Thêm Sinh Viên Mới
                    </div>
                    <div class="card-body">
                        <form id="addStudentForm" onsubmit="addStudent(event)">
                            <div class="row g-3">
                                <div class="col-md-2">
                                    <input type="text" class="form-control" id="studentCode" placeholder="Mã SV" required>
                                </div>
                                <div class="col-md-3">
                                    <input type="text" class="form-control" id="fullName" placeholder="Họ và tên" required>
                                </div>
                                <div class="col-md-3">
                                    <input type="email" class="form-control" id="email" placeholder="Email" required>
                                </div>
                                <div class="col-md-2">
                                    <input type="text" class="form-control" id="phone" placeholder="Số điện thoại">
                                </div>
                                <div class="col-md-2">
                                    <input type="text" class="form-control" id="className" placeholder="Lớp">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary mt-3">
                                <i class="fas fa-plus-circle"></i> Thêm Mới
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Thanh Tìm Kiếm -->
                <div class="input-group mb-4 shadow-sm">
                    <input type="text" id="keyword" class="form-control" placeholder="Nhập từ khóa tìm kiếm (Mã, Tên, Email, SĐT)...">
                    <button class="btn btn-outline-secondary" type="button" onclick="loadStudents()">
                        <i class="fas fa-search"></i> Tìm kiếm
                    </button>
                </div>

                <!-- Bảng Dữ Liệu -->
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white fw-bold">
                        <i class="fas Table"></i> Danh Sách Sinh Viên Trong Hệ Thống
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-striped table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>Mã SV</th>
                                    <th>Họ và Tên</th>
                                    <th>Email</th>
                                    <th>Số Điện Thoại</th>
                                    <th>Lớp</th>
                                    <th class="text-center">Hành động</th>
                                </tr>
                            </thead>
                            <tbody id="studentTableBody">
                                <!-- Dữ liệu load tự động qua JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- JavaScript xử lý API -->
    <script>
        const API_URL = '/api/students';

        async function loadStudents() {
            const keyword = document.getElementById('keyword').value;
            let url = API_URL;
            if (keyword) url += `?keyword=${encodeURIComponent(keyword)}`;

            try {
                const response = await fetch(url);
                const students = await response.json();
                const tbody = document.getElementById('studentTableBody');
                tbody.innerHTML = '';

                students.forEach(s => {
                    tbody.innerHTML += `
                        <tr>
                            <td class="fw-bold">${s.studentCode}</td>
                            <td>${s.fullName}</td>
                            <td>${s.email}</td>
                            <td>${s.phone || ''}</td>
                            <td><span class="badge bg-secondary">${s.className || ''}</span></td>
                            <td class="text-center">
                                <button class="btn btn-danger btn-sm" onclick="deleteStudent('${s.id}')">
                                    <i class="fas fa-trash-alt"></i> Xóa
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error('Lỗi tải dữ liệu:', error);
            }
        }

        async function addStudent(event) {
            event.preventDefault();
            const data = {
                studentCode: document.getElementById('studentCode').value,
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                className: document.getElementById('className').value
            };

            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                document.getElementById('addStudentForm').reset();
                loadStudents();
            } else {
                alert('Thêm sinh viên thất bại!');
            }
        }

        async function deleteStudent(id) {
            if (confirm('Bạn có chắc chắn muốn xóa sinh viên này không?')) {
                const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (res.ok) loadStudents();
            }
        }

        window.onload = loadStudents;
    </script>
</body>
</html>
